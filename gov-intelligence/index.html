<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>ARILUB · GOV Intelligence</title>
<style>
:root{--n:#00358F;--bg:#F4F6F8;--tx:#17212B;--g:#5F6B76;--ln:#D9E2EC}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(620px,100%);background:#fff;border:1px solid var(--ln);border-radius:12px;padding:32px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.06)}
.logo{display:inline-flex;align-items:center;justify-content:center;background:var(--n);color:#fff;border-radius:10px;padding:14px 22px;font-size:20px;font-weight:800;letter-spacing:.4px;margin-bottom:24px}
h1{font-size:24px;margin:0 0 10px;color:var(--n)}
p{margin:0;color:var(--g);font-size:14px;line-height:1.5}
.badge{display:inline-block;margin-top:18px;border:1px solid var(--ln);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--n);background:#F8FBFE}
</style>
</head>
<body>
  <main class="card">
    <div class="logo">ARILUB</div>
    <h1>GOV Intelligence</h1>
    <p>Publicação temporariamente indisponível.</p>
    <span class="badge">ACESSO BLOQUEADO</span>
  </main>
</body>
</html>
