        <div class="risk-total"><span class="muted">RISCO GERAL</span><div class="n">76</div><span class="risk-pill mid">ATENÇÃO</span></div>
        <div>
          <div class="alert"><b>Leitura executiva:</b> oportunidade boa, mas exige atenção ao caixa e ao fornecedor. Não há alerta jurídico relevante nesta simulação.</div>
          <div class="sourcebox">Escala: 90–100 muito seguro · 75–89 atenção controlada · 60–74 risco relevante · abaixo de 60 recomendação de revisão/NO-GO.</div>
        </div>
      </div>
    </div>
    <div class="section risk-grid">
      <div class="risk-card"><span class="risk-pill low">BAIXO</span><strong>Comercial</strong><div class="risk-score risk-low">90</div><div class="risk-note">Boa aderência do produto, histórico comparável e preço de mercado conhecido.</div></div>
      <div class="risk-card"><span class="risk-pill mid">ATENÇÃO</span><strong>Financeiro</strong><div class="risk-score risk-mid">72</div><div class="risk-note">Compra antecipada relevante e recebimento estimado em cerca de 30 dias.</div></div>
      <div class="risk-card"><span class="risk-pill mid">ATENÇÃO</span><strong>Fornecedor</strong><div class="risk-score risk-mid">68</div><div class="risk-note">Confirmar estoque, validade da cotação, limite de crédito e prazo real de reposição.</div></div>
      <div class="risk-card"><span class="risk-pill low">BAIXO</span><strong>Execução</strong><div class="risk-score risk-low">84</div><div class="risk-note">Logística viável, mas prazo de entrega de 10 dias exige confirmação antes do lance.</div></div>
      <div class="risk-card"><span class="risk-pill low">BAIXO</span><strong>Jurídico</strong><div class="risk-score risk-low">92</div><div class="risk-note">Sem exigência especial aparente; documentação e cláusulas críticas devem ser conferidas.</div></div>
    </div>
    <div class="section card">
      <h3>Sinais que o motor deve observar</h3>
      <table class="table"><thead><tr><th>Bloco</th><th>Sinais principais</th><th>Ação</th></tr></thead><tbody>
        <tr><td>Comercial</td><td>Preço histórico, concorrência, margem e aderência</td><td>Definir preço-alvo e limite de abandono</td></tr>
        <tr><td>Financeiro</td><td>Desembolso, prazo de recebimento, custo financeiro e exposição</td><td>Validar capital de giro antes de aprovar</td></tr>
        <tr><td>Fornecedor</td><td>Estoque, cotação, crédito, prazo e dependência</td><td>Confirmar fornecedor antes da disputa</td></tr>
        <tr><td>Execução</td><td>Prazo, frete, instalação, garantia e logística</td><td>Bloquear oportunidade inviável operacionalmente</td></tr>
        <tr><td>Jurídico</td><td>Habilitação, sanções, exigências e cláusulas críticas</td><td>Revisão humana nos alertas relevantes</td></tr>
      </tbody></table>
    </div>
    <div class="section card">
      <div class="alert good"><b>Princípio do motor:</b> oportunidade com bom preço não será automaticamente boa. Ela precisa fechar comercialmente, financeiramente e operacionalmente ao mesmo tempo.</div>
    </div>`;
  d.getElementById('robots').before(riskcockpit);

  const swot=d.createElement('section'); swot.id='swot'; swot.className='view';
  swot.innerHTML=`
    <div class="card">
      <div class="page-head" style="margin-bottom:12px">
        <div><h3>SWOT Executiva — Nova Operação GOV</h3><div class="muted">Leitura simples do ponto de partida da ARILUB para crescer em negócios públicos.</div></div>
        <span class="badge mock">VISÃO EXECUTIVA</span>
      </div>
      <div class="swot-grid">
        <div class="swot-card strength"><h3>Forças</h3><ul>
          <li>Capacidade de vender várias linhas de produtos, não só lubrificantes.</li>
          <li>Experiência real com clientes públicos e fornecimento institucional.</li>
          <li>Histórico comercial suficiente para mostrar o que a ARILUB já consegue comprar e entregar.</li>
          <li>Estrutura de dados, painéis e automações já criada.</li>
        </ul></div>
        <div class="swot-card weakness"><h3>Fraquezas</h3><ul>
          <li>Histórico de licitações ainda pouco estruturado para comparar lances, perdas e concorrentes.</li>
          <li>Capital de giro pode limitar oportunidades maiores.</li>
          <li>Dependência de fornecedor, estoque e prazo de entrega precisa ser validada caso a caso.</li>
          <li>Alguns dados antigos ainda não permitem reconstruir todo o caminho do certame.</li>
        </ul></div>
        <div class="swot-card opportunity"><h3>Oportunidades</h3><ul>
          <li>Acessar um universo muito maior de compras públicas no GOV.</li>
          <li>Entrar em novas categorias com base em margem, prazo e capacidade de fornecimento.</li>
          <li>Usar histórico de preços, vencedores e pagamentos para escolher melhor onde participar.</li>
          <li>Transformar dados públicos em vantagem competitiva própria.</li>
        </ul></div>
        <div class="swot-card threat"><h3>Riscos Externos</h3><ul>
          <li>Guerra de preço e margem insuficiente.</li>
          <li>Atraso de pagamento e capital parado por muito tempo.</li>
          <li>Erro técnico no item, documentação ou prazo de entrega.</li>
          <li>Concorrentes recorrentes com maior escala ou preço de compra melhor.</li>
        </ul></div>
      </div>
    </div>
    <div class="section card">
      <h3>Insights para decisão</h3>
      <div class="insight-grid">
        <div class="insight-card"><b>1. Não entrar só porque o edital parece bom</b><span>Preço, margem, prazo, fornecedor e recebimento precisam fechar juntos.</span></div>
        <div class="insight-card"><b>2. Caixa é parte da estratégia</b><span>Uma oportunidade grande pode ser ruim se exigir muito dinheiro antes do recebimento.</span></div>
        <div class="insight-card"><b>3. O motor deve aprender</b><span>Cada disputa vencida ou perdida melhora preço, concorrência e decisão futura.</span></div>
      </div>
    </div>
    <div class="section card">
      <div class="alert good"><b>Leitura executiva:</b> a ARILUB já tem capacidade comercial para entrar nesse mercado, mas o crescimento deve ser seletivo. O diferencial será escolher melhor as oportunidades — não participar de tudo.</div>
    </div>`;
  d.getElementById('robots').before(swot);

  const robots=d.getElementById('robots');
  const engine=(name,out,badge='MOTOR')=>`<div class="card"><span class="badge ${badge==='CONECTOR'?'real':'mock'}">${badge}</span><strong>${name}</strong><span class="muted">${out}</span><button class="mini-btn engineShow" data-name="${name}" data-out="${out}">Ver saída</button></div>`;
  robots.innerHTML=`
    <div class="robot">
      ${engine('PNCP Connector','Contratações, itens, resultados, atas, contratos e PCA.','CONECTOR')}
      ${engine('Compras.gov Open Data','Pregões, itens, preços praticados, fornecedores e resultados.','CONECTOR')}
      ${engine('Opportunity Scanner','Varre, deduplica e classifica novas oportunidades.')}
      ${engine('Catalog Normalizer','Relaciona descrições a CATMAT/CATSER e famílias comerciais.')}
      ${engine('Capability Matcher','Cruza capacidade histórica, sourcing e viabilidade operacional.')}
      ${engine('Historical Intelligence','Consolida vencedores, preços, homologações e recorrência.')}
      ${engine('Public Expenditure Connector','Coleta empenho, liquidação e pagamento em bases públicas estruturadas.','CONECTOR')}
      ${engine('Payment Risk Engine','Calcula prazo efetivo, dispersão, atrasos e confiança por órgão/unidade.')}
      ${engine('Ata / Lance Reader','Reconstrói dinâmica de disputa a partir de atas públicas acessíveis.')}
      ${engine('Edital AI','Extrai requisitos, riscos, prazos e obrigações.')}
      ${engine('Price & Risk Engine','Calcula referência, margem, capital e limite de disputa.')}
      ${engine('Competitor Intelligence','Mapeia frequência de vitórias e faixas vencedoras.')}
      ${engine('Opportunity Score','Consolida aderência, margem, prazo e risco.')}
      ${engine('Alert & Learning Engine','Monitora prazos, retificações e retroalimenta o motor.')}
    </div>
    <div class="section cols">
      <div class="card"><h3>Orquestração</h3><div class="flow"><span class="node">Fontes</span><span class="arrow">→</span><span class="node">Scanner</span><span class="arrow">→</span><span class="node">Catálogo</span><span class="arrow">→</span><span class="node">Capacidade</span><span class="arrow">→</span><span class="node">Histórico</span><span class="arrow">→</span><span class="node">Recebimento</span><span class="arrow">→</span><span class="node">Ata/Lances</span><span class="arrow">→</span><span class="node">Edital</span><span class="arrow">→</span><span class="node">Preço/Risco</span><span class="arrow">→</span><span class="node">Score</span><span class="arrow">→</span><span class="node">Humano</span></div><div class="sourcebox">Os motores são etapas independentes, com entrada, saída e rastreabilidade próprias.</div></div>
      <div class="card engine-output" id="engineOutput"><span class="badge mock">MAPA DE MOTORES</span><h3>Clique em “Ver saída”</h3><p class="muted">O painel mostrará o papel e o produto de dados de cada motor.</p></div>
    </div>`;

  const scan=d.getElementById('scan');
  const srcbox=scan.querySelector('.sourcebox');
  const eb=d.createElement('div'); eb.className='engineboard'; eb.id='engineboard';
  const engineNames=['Source Collector','Opportunity Scanner','Catalog Normalizer','Capability Matcher','Historical Intelligence','Payment Risk Engine','Edital AI','Price & Risk Engine','Opportunity Score'];
  eb.innerHTML=engineNames.map((n,i)=>`<div class="engineitem" data-engine="${i}"><b>${String(i+1).padStart(2,'0')} · ${n}</b><div class="estate"><span class="edot"></span><span>Aguardando</span></div></div>`).join('');
  srcbox.before(eb);

  const homeCards=d.querySelector('#home .section .robot');
  if(homeCards) homeCards.innerHTML='<div class="card"><span class="badge real">CAMADA 1</span><strong>Descoberta & Coleta</strong><span class="muted">PNCP, Compras.gov, PCA, catálogos e documentos.</span></div><div class="card"><span class="badge mock">CAMADA 2</span><strong>Inteligência Histórica</strong><span class="muted">Preços, vencedores, resultados e leitura de atas/lances.</span></div><div class="card"><span class="badge mock">CAMADA 3</span><strong>Decisão Assistida</strong><span class="muted">Aderência, edital, margem, risco e score.</span></div>';

  const filtersView=d.getElementById('filters');
  if(filtersView){
    const rf=d.createElement('div'); rf.className='section card';
    rf.innerHTML='<span class="badge mock">NOVO FILTRO</span><h3>Prazo histórico de recebimento</h3><div class="filtergrid"><div><label>Prazo máximo aceitável</label><select><option>Sem limite</option><option>Até 30 dias</option><option>Até 45 dias</option><option>Até 60 dias</option><option>Até 90 dias</option></select></div><div><label>Risco máximo</label><select><option>Qualquer</option><option>Baixo</option><option>Baixo ou médio</option></select></div><div><label>Confiança mínima</label><select><option>Média</option><option>Alta</option><option>Qualquer</option></select></div></div><div class="sourcebox">Esse filtro usará prazo <b>efetivamente observado</b>, e não apenas o prazo escrito no edital. Quando não houver dados suficientes, a oportunidade permanece visível com aviso de baixa confiança.</div>';
    filtersView.appendChild(rf);
  }

  const names={home:'Central de Inteligência em Negócios Públicos',radar:'Radar de Oportunidades GOV',detail:'Raio-X da Oportunidade',history:'Histórico Competitivo',paymentrisk:'Risco de Recebimento',riskcockpit:'Cockpit de Risco',swot:'SWOT & Insights',robots:'Robôs & Integrações',filters:'Estratégia & Filtros',live:'Sala de Disputa Assistida',post:'Pós-certame & Aprendizado'};
  function showV4(id){
    d.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
    const el=d.getElementById(id); if(el) el.classList.add('active');
    d.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===id));
    d.getElementById('title').textContent=names[id]||'ARILUB GOV Intelligence';
    w.scrollTo(0,0);
  }
  d.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showV4(b.dataset.v));
  d.querySelectorAll('.goDetail').forEach(b=>b.onclick=()=>showV4('detail'));
  d.querySelectorAll('.goHistory').forEach(b=>b.onclick=()=>showV4('history'));
  d.querySelectorAll('.goPaymentRisk').forEach(b=>b.onclick=()=>showV4('paymentrisk'));
  d.querySelectorAll('.goRiskCockpit').forEach(b=>b.onclick=()=>showV4('riskcockpit'));
  d.querySelectorAll('.detail-tabs button').forEach(b=>b.onclick=()=>{
    d.querySelectorAll('.detail-tabs button').forEach(x=>x.classList.remove('on'));
    d.querySelectorAll('#detail .tabpane').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); d.getElementById('tab-'+b.dataset.tab).classList.add('on');
  });
  d.querySelectorAll('.histDetail').forEach(b=>b.onclick=()=>d.getElementById('historyDetail').scrollIntoView({behavior:'smooth',block:'start'}));
  d.querySelectorAll('.engineShow').forEach(b=>b.onclick=()=>{
    d.getElementById('engineOutput').innerHTML='<span class="badge mock">SAÍDA DO MOTOR</span><h3>'+b.dataset.name+'</h3><p>'+b.dataset.out+'</p><div class="sourcebox">Cada saída será armazenada com fonte, horário, identificador da contratação/item e versão do motor, permitindo auditoria e reprocessamento.</div>';
  });

  const steps=[
    ['Source Collector conectando PNCP, Compras.gov, PCA e Dados Abertos...',12,684120,731,1842,0,0],
    ['Opportunity Scanner pesquisando contratações, itens e novas publicações...',27,2198360,2184,18420,34,1],
    ['Catalog Normalizer padronizando CATMAT/CATSER, descrições e sinônimos...',41,4124822,4823,52610,91,2],
    ['Capability Matcher cruzando linhas de fornecimento com capacidade ARILUB...',55,5489314,4823,52610,184,3],
    ['Historical Intelligence consultando preços, vencedores e homologações...',66,6350921,4823,52610,226,4],
    ['Payment Risk Engine cruzando empenhos, liquidações, pagamentos e prazos efetivos...',75,6814330,4823,52610,119,5],
    ['Edital AI lendo requisitos, prazos, habilitação e riscos...',83,7126440,4823,52610,63,6],
    ['Price & Risk Engine calculando referências, margem e limite estratégico...',92,8249732,4823,52610,21,7],
    ['Opportunity Score priorizando as melhores oportunidades para revisão humana...',100,8912450,4823,52610,11,8]
  ];
  const fmt=n=>new Intl.NumberFormat('pt-BR').format(Math.round(n));
  function tween(el,a,b,dur=700,formatter=fmt){const st=performance.now();function f(now){const q=Math.min(1,(now-st)/dur),e=1-Math.pow(1-q,3);el.textContent=formatter(a+(b-a)*e);if(q<1)w.requestAnimationFrame(f)}w.requestAnimationFrame(f)}
  d.getElementById('start').onclick=()=>{
    const s=d.getElementById('scan'),bar=d.getElementById('scanbar'),log=d.getElementById('log'),pct=d.getElementById('pct'),ring=d.getElementById('ring'),phase=d.getElementById('phase'),records=d.getElementById('records'),m1=d.getElementById('m1'),m2=d.getElementById('m2'),m3=d.getElementById('m3');
    s.style.display='block';log.innerHTML='';bar.style.width='0';pct.textContent='0%';records.textContent='0';m1.textContent=m2.textContent=m3.textContent='0';d.querySelectorAll('.engineitem').forEach(e=>e.classList.remove('active','done'));
    let i=0,prev=[0,0,0,0,0];
    const run=()=>{
      if(i>=steps.length){d.querySelectorAll('.engineitem').forEach(e=>{e.classList.remove('active');e.classList.add('done')});setTimeout(()=>showV4('radar'),1300);return}
      const x=steps[i++],p=x[1],ei=x[6];
      d.querySelectorAll('.engineitem').forEach((e,idx)=>{e.classList.toggle('done',idx<ei);e.classList.toggle('active',idx===ei)});
      phase.textContent=x[0];bar.style.width=p+'%';ring.style.background='conic-gradient(var(--b) '+(p*3.6)+'deg,#e4edf5 0deg)';
      tween(pct,prev[0],p,700,v=>Math.round(v)+'%');tween(records,prev[1],x[2]);tween(m1,prev[2],x[3]);tween(m2,prev[3],x[4]);tween(m3,prev[4],x[5]);
      log.innerHTML='<div><b>MOTOR '+String(ei+1).padStart(2,'0')+' · ETAPA '+i+'/'+steps.length+'</b> &nbsp;●&nbsp; '+x[0]+'</div>';
      prev=[p,x[2],x[3],x[4],x[5]];setTimeout(run,1000);
    };run();
  };
});
</script>
</body>
</html>
