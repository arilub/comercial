<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARILUB · Painel de Inteligência Comercial</title>
<style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F4F6F8;color:#17212B}.loading{min-height:100vh;display:grid;place-items:center}.box{padding:24px;text-align:center;color:#00358F}.err{color:#9b1c1c}</style>
</head>
<body>
<div class="loading"><div class="box" id="status">Carregando Painel de Inteligência Comercial…</div></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/arilub/comercial/b251426b2dc68d769a83ac3da65a83d9ed194b3e/painel_inteligencia-arilub_36_meses/index.html';
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();
    const original=`fMonth.innerHTML='<option value="">Todos os meses</option>'+MONTHS.map(m=>\`<option value="\${m}">\${ml(m)}</option>\`).join('');`;
    const adjusted=`fMonth.innerHTML='<option value="">Todos os meses</option>'+[...MONTHS].reverse().map(m=>\`<option value="\${m}">\${ml(m)}</option>\`).join('');`;
    if(!html.includes(original)) throw new Error('Trecho do seletor de mês não localizado');
    html=html.replace(original,adjusted);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('status').innerHTML='<div class="err"><b>Não foi possível carregar o painel.</b><br><small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
</body>
</html>
