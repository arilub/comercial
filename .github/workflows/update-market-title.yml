name: Update market panel title

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace only the visible panel title
        shell: python
        run: |
          from pathlib import Path
          path = Path('painel_inteligencia-arilub_36_meses/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="ttl">Painel de Inteligência Comercial</div>'
          new = '<div class="ttl">Inteligência de Mercado</div>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one title occurrence, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/title-update-trigger.txt').unlink(missing_ok=True)
      - name: Commit title change to PR branch
        run: |
          git config user.name "ARILUB Automation"
          git config user.email "actions@users.noreply.github.com"
          git add painel_inteligencia-arilub_36_meses/index.html .github/title-update-trigger.txt
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git commit -m "Ajusta título para Inteligência de Mercado"
          git push origin HEAD:${{ github.head_ref }}
